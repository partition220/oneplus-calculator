<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Калькулятор</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background-color:#17171c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px;height:100vh;display:flex;flex-direction:column;justify-content:flex-end}
        
        #hist-open-btn{color:#ff9f0a;font-size:1.1rem;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin-top:5px;margin-bottom:5px;padding:5px 10px;background:none;border:none;cursor:pointer;text-align:left;outline:none;width:fit-content;z-index:20}
        
        #hist-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:#17171c;z-index:100;padding:20px;flex-direction:column}
        #hist-header{display:block;width:100%;margin-bottom:20px;border-bottom:1px solid #232328;padding-bottom:10px;height:40px}
        #hist-title{color:#fff;font-size:1.4rem;font-weight:bold;text-transform:uppercase;float:left}
        .hist-btn-box{float:right;display:flex;gap:15px}
        .hist-ctrl-btn{background:none;border:none;color:#ff9f0a;font-size:1.2rem;cursor:pointer;outline:none;font-weight:500}
        #hist-log{width:100%;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px 0;clear:both}
        .history-item{color:#a5a5a5;font-size:1.4rem;text-align:left;white-space:nowrap;border-bottom:1px solid #232328;padding-bottom:8px}
        
        /* Задаем экрану стабильные 30% от высоты телефона, чтобы плашка поднялась точно до линии */
        #display-container{width:100%;height:30vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:10px;overflow:hidden;position:relative;margin-top:auto;margin-bottom:10px}
        #expression{color:#74747c;font-size:1.4rem;min-height:1.6rem;text-align:right;width:100%;margin-bottom:2px;white-space:nowrap;overflow-x:auto}
        #display{width:100%;background:transparent;border:none;color:#fff;font-size:3.5rem;text-align:right;outline:none}
        
        /* Плашка теперь идеально заполняет увеличенный до линии контейнер дисплея */
        #secret-plate{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background-color:#eb4034;border-radius:24px;justify-content:center;align-items:center;text-align:center;padding:15px;z-index:10}
        #secret-text{color:#ffffff;font-size:2.8rem;font-weight:500;line-height:1.2;letter-spacing:0px}
        
        .calc-table{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed;margin-bottom:5px;z-index:5}
        .calc-btn{display:block;width:100%;aspect-ratio:1;border:none;border-radius:18px;cursor:pointer;user-select:none;font-size:2rem;font-weight:500;outline:none;text-align:center}
        .calc-btn:active{opacity:.6}
        .btn-dark{background-color:#232328;color:#fff}
        .btn-orange-text{background-color:#232328;color:#ff9f0a;font-size:2.4rem}
        .btn-equal{background-color:#ff9f0a;color:#fff;font-size:2.4rem}
    </style>
</head>
<body>
    <button id="hist-open-btn" onclick="openHist()">история примеров</button>
    
    <div id="hist-modal">
        <div id="hist-header">
            <span id="hist-title">История</span>
            <div class="hist-btn-box">
                <button class="hist-ctrl-btn" style="color:#ef4444" onclick="clearHist()">Очистить</button>
                <button class="hist-ctrl-btn" onclick="closeHist()">Закрыть</button>
            </div>
        </div>
        <div id="hist-log"></div>
    </div>
    
    <div id="display-container">
        <div id="secret-plate"><div id="secret-text">Never<br>Settle</div></div>
        <div id="expression"></div>
        <input type="text" id="display" readonly value="0">
    </div>
    
    <table class="calc-table">
        <tr>
            <td><button class="calc-btn btn-orange-text" onclick="v('-')">−</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('7')">7</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('8')">8</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('9')">9</button></td>
            <td><button class="calc-btn btn-equal" onclick="c()">=</button></td>
        </tr>
        <tr>
            <td><button class="calc-btn btn-orange-text" onclick="v('/')">÷</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('4')">4</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('5')">5</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('6')">6</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="v('Math.E')">e</button></td>
        </tr>
        <tr>
            <td><button class="calc-btn btn-orange-text" onclick="v('+')">+</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('1')">1</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('2')">2</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('3')">3</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="v('Math.PI')">π</button></td>
        </tr>
        <tr>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="f()">!</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="b()">C</button></td>
            <td><button class="calc-btn btn-dark" onclick="v('0')">0</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="a()">AC</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="v('%')">%</button></td>
        </tr>
        <tr>
            <td><button class="calc-btn btn-orange-text" onclick="v('*')">×</button></td>
            <td><button class="calc-btn btn-orange-text" onclick="v('(')">(</button></td>
            <td><button class="calc-btn btn-orange-text" onclick="v(')')">)</button></td>
            <td><button class="calc-btn btn-orange-text" onclick="v('.')">.</button></td>
            <td><button class="calc-btn btn-orange-text" style="font-size:2rem" onclick="v('Math.sqrt(')">√</button></td>
        </tr>
    </table>
<script>
    const d=document.getElementById('display'),e=document.getElementById('expression'),h=document.getElementById('hist-log'),m=document.getElementById('hist-modal'),sP=document.getElementById('secret-plate');
    let expr='',r=false;
    const ops=['+','-','*','/','.','%'];
    function fmt(s){return s.replace(/Infinity/g,'∞').replace(/Math\.PI/g,'π').replace(/Math\.E/g,'e').replace(/Math\.sqrt\(/g,'√(').replace(/\*/g,'×').replace(/\//g,'÷')}
    function scr(){d.scrollLeft=d.scrollWidth;e.scrollLeft=e.scrollWidth}
    window.history.replaceState({page:1},'');window.history.pushState({page:2},'');
    window.onpopstate=function(){
        if(m.style.display==='flex'){closeHist();window.history.pushState({page:2},'')}
        else if(sP.style.display==='flex'){a();window.history.pushState({page:2},'')}
    };
    function openHist(){m.style.display='flex'}
    function closeHist(){m.style.display='none'}
    function clearHist(){h.innerHTML=''}
    function v(val){
        if(sP.style.display==='flex')return;
        if(r&&!ops.includes(val)){expr='';r=false}else if(r){r=false}
        if(expr==='0'&&!isNaN(val)&&val!=='.')expr='';
        let last=expr.slice(-1);
        if(ops.includes(val)){
            if(expr===''&&(val==='-'||val==='+')){expr+=val;d.value=fmt(expr);return}
            if(expr===''||expr==='-'||expr==='+')return;
            if(ops.includes(last)){
                if(val==='-'&&!expr.endsWith('--')&&last!=='.'){expr+=val;d.value=fmt(expr);scr();return}
                if(expr.endsWith('Math.sqrt(')||expr.endsWith('('))return;
                expr=expr.slice(0,-1)+val;d.value=fmt(expr);return;
            }
        }
        expr+=val;d.value=fmt(expr);scr();
    }
    function a(){expr='';d.value='0';e.innerText='';sP.style.display='none'}
    function b(){
        if(sP.style.display==='flex'){a();return}
        if(r){a();r=false;return}
        expr=expr.endsWith('Math.sqrt(')?expr.slice(0,-10):expr.endsWith('Math.PI')||expr.endsWith('Math.E')?expr.slice(0,-7):expr.slice(0,-1);
        d.value=expr?fmt(expr):'0';scr();
    }
    function f(){if(sP.style.display==='flex'||expr===''||ops.includes(expr.slice(-1)))return;if(r){expr='';r=false}expr+='!';d.value=fmt(expr);scr()}
    function fact(n){return n<0?NaN:n<=1?1:n*fact(n-1)}
    function c(){
        try{
            if(!expr||sP.style.display==='flex')return;
            if(expr==='1+'){sP.style.display='flex';return}
            if(ops.includes(expr.slice(-1)))return;
            let fE=fmt(expr),p=expr.replace(/%/g,'/100').replace(/(\d+)!/g,'fact($1)'),o=(p.match(/\(/g)||[]).length,cl=(p.match(/\)/g)||[]).length;
            while(o>cl){p+=')';o--}
            let res=eval(p);if(res%1!==0)res=parseFloat(res.toFixed(10));
            let fTx=fE+' = '+fmt(res.toString());e.innerText=fE+' =';d.value=fmt(res.toString());
            const i=document.createElement('div');i.className='history-item';i.innerText=fTx;h.appendChild(i);h.scrollTop=h.scrollHeight;
            expr=res.toString();r=true;scr();
        }catch(err){d.value='Ошибка';expr='';r=true}
    }
</script>
</body>
</html>
